<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; fill: #64748b; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .node-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #0284c7; }
      .solid-arrow { stroke: #0284c7; stroke-width: 2; fill: none; }
      .backoff-arrow { stroke: #e11d48; stroke-width: 2; fill: none; }
      .query-arrow { stroke: #0d9488; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
    </marker>
  </defs>

  <!-- Header Section -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="1080" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="30" y="32" class="title">Elasticsearch Enterprise Full-Text Search Architecture</text>
    <text x="30" y="52" class="subtitle">Custom Analyzers (Edge n-Gram, Synonyms, HTML Stripper), Resilient Backoff Ingestion &amp; Sharded Inverted Index</text>
    <rect x="910" y="22" width="140" height="26" rx="13" fill="#0284c7"/>
    <text x="980" y="39" text-anchor="middle" class="badge-text">SEARCH &amp; INDEXING</text>
  </g>

  <!-- 1. Resilient Ingestion & Bulk Engine -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="260" height="500" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="20" y="30" class="group-title">1. Resilient Bulk Ingestion</text>

    <!-- Ingestion Engine Box -->
    <g transform="translate(15, 55)">
      <rect width="230" height="155" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="10" fill="#e0f2fe"/>
      <path d="M 21 27 L 25 18 L 29 27 Z" fill="#0284c7"/>
      <text x="45" y="24" class="node-title">Python Bulk Indexer</text>
      <text x="45" y="38" class="node-desc">indexer.py</text>
      <text x="15" y="65" class="node-desc">• Chunked streaming NDJSON batches</text>
      <text x="15" y="83" class="node-desc">• 200 documents per chunk</text>
      <text x="15" y="101" class="node-desc">• Throughput: 10,000+ docs/sec</text>
      <text x="15" y="119" class="node-desc">• Automatic ID generation &amp; typing</text>
      <text x="15" y="142" class="node-tag">POST /_bulk API endpoint</text>
    </g>

    <!-- Backoff Controller Box -->
    <g transform="translate(15, 230)">
      <rect width="230" height="150" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#ffe4e6"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 11px; font-weight:bold; fill:#e11d48;">EB</text>
      <text x="50" y="26" class="node-title">Exponential Backoff</text>
      <text x="50" y="40" class="node-tag" style="fill:#be123c;">QUEUE MITIGATION</text>
      <text x="15" y="68" class="node-desc">• Catches HTTP 429 &amp; 503 errors</text>
      <text x="15" y="86" class="node-desc">• Initial backoff: 1.0s • Factor: 2.0x</text>
      <text x="15" y="104" class="node-desc">• Randomized jitter (100ms-500ms)</text>
      <text x="15" y="122" class="node-desc">• Maximum retry budget: 5 attempts</text>
      <text x="15" y="139" class="node-desc">• Item-level status inspection</text>
    </g>

    <!-- Network Security -->
    <g transform="translate(15, 400)">
      <rect width="230" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="24" class="node-title">Security &amp; Transport</text>
      <text x="15" y="45" class="node-desc">API Key Auth • TLS In-Transit</text>
      <text x="15" y="65" class="node-tag">Zero Credential Exposure</text>
    </g>
  </g>

  <!-- Arrow: Ingestion -> Analysis Engine -->
  <path d="M 320 320 L 370 320" class="solid-arrow" marker-end="url(#arrow)"/>

  <!-- 2. Text Analysis & Tokenization Pipeline -->
  <g transform="translate(370, 140)">
    <rect x="0" y="0" width="380" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="25" y="30" class="group-title">2. Analysis Engine (mapping.json)</text>

    <!-- Autocomplete Edge n-gram -->
    <g transform="translate(20, 55)">
      <rect width="340" height="120" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#e0f2fe"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 11px; font-weight:bold; fill:#0284c7;">AC</text>
      <text x="50" y="26" class="node-title">autocomplete_analyzer</text>
      <text x="50" y="40" class="node-tag">INSTANT AS-YOU-TYPE SEARCH</text>
      <text x="15" y="68" class="node-desc"><b>Tokenizer:</b> standard • <b>Filter:</b> lowercase</text>
      <text x="15" y="86" class="node-desc"><b>edge_ngram:</b> min_gram: 2, max_gram: 15</text>
      <text x="15" y="106" class="node-desc">Powers instant prefix search on <code>title</code> field</text>
    </g>

    <!-- Synonym & Semantic Analyzer -->
    <g transform="translate(20, 190)">
      <rect width="340" height="135" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#ede9fe"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 11px; font-weight:bold; fill:#6366f1;">SY</text>
      <text x="50" y="26" class="node-title">content_analyzer (Synonyms &amp; HTML)</text>
      <text x="50" y="40" class="node-tag" style="fill:#6366f1;">SEMANTIC &amp; RICH TEXT</text>
      <text x="15" y="68" class="node-desc"><b>Char Filter:</b> html_strip (strips &lt;p&gt;, &lt;b&gt; tags)</text>
      <text x="15" y="86" class="node-desc"><b>Synonyms:</b> k8s ➔ kubernetes, db ➔ database</text>
      <text x="15" y="104" class="node-desc"><b>Stemmer:</b> English algorithmic stemming</text>
      <text x="15" y="122" class="node-desc"><b>Stopwords:</b> Removes English filler words</text>
    </g>

    <!-- Multi-Fields & Completion -->
    <g transform="translate(20, 340)">
      <rect width="340" height="135" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
      <rect x="15" y="15" width="26" height="26" rx="4" fill="#ccfbf1"/>
      <text x="28" y="33" text-anchor="middle" style="font-family: sans-serif; font-size: 11px; font-weight:bold; fill:#0d9488;">MF</text>
      <text x="50" y="26" class="node-title">Multi-Fields &amp; Completion Suggesters</text>
      <text x="50" y="40" class="node-tag" style="fill:#0d9488;">EXACT &amp; AGGREGATIONS</text>
      <text x="15" y="68" class="node-desc">• <code>title.keyword</code>: Exact sorting &amp; term filtering</text>
      <text x="15" y="86" class="node-desc">• <code>description.suggest</code>: In-memory FST completion</text>
      <text x="15" y="104" class="node-desc">• <code>price</code>: scaled_float (100x scaling factor)</text>
      <text x="15" y="122" class="node-desc">• <code>category</code>: keyword with strict indexing</text>
    </g>
  </g>

  <!-- Arrow: Analysis -> Physical Index -->
  <path d="M 750 320 L 800 320" class="solid-arrow" marker-end="url(#arrow)"/>

  <!-- 3. Physical Index & Query Consumers -->
  <g transform="translate(800, 140)">
    <rect x="0" y="0" width="340" height="500" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="25" y="30" class="group-title">3. Shards &amp; Search API</text>

    <!-- Inverted Index & Shards -->
    <g transform="translate(20, 55)">
      <rect width="300" height="185" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="20" y="25" class="node-title">Sharded Inverted Index</text>
      <text x="20" y="42" class="node-tag">3 PRIMARIES • 1 REPLICA</text>
      <text x="20" y="70" class="node-desc">📦 <b>Shard 0:</b> Primary (Node 1) • Replica (Node 2)</text>
      <text x="20" y="92" class="node-desc">📦 <b>Shard 1:</b> Primary (Node 2) • Replica (Node 3)</text>
      <text x="20" y="114" class="node-desc">📦 <b>Shard 2:</b> Primary (Node 3) • Replica (Node 1)</text>
      <text x="20" y="136" class="node-desc">• Refresh Interval: 5 seconds</text>
      <text x="20" y="154" class="node-desc">• Async translog durability for ingest bursts</text>
      <text x="20" y="174" class="node-tag">High query concurrency throughput</text>
    </g>

    <!-- Query Consumers & Kibana -->
    <g transform="translate(20, 260)">
      <rect width="300" height="215" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
      <text x="20" y="25" class="node-title">Search APIs &amp; Kibana Discovery</text>
      <text x="20" y="45" class="node-tag" style="fill:#0d9488;">REAL-TIME RETRIEVAL</text>

      <g transform="translate(15, 60)">
        <rect width="270" height="35" rx="4" fill="#f0fdf4"/>
        <text x="10" y="22" style="font-family: monospace; font-size: 11px; font-weight:bold; fill:#166534;">GET /search_index/_search</text>
      </g>

      <text x="20" y="120" class="node-desc">• As-you-type autocomplete queries</text>
      <text x="20" y="140" class="node-desc">• Multi-match cross-field scoring (BM25)</text>
      <text x="20" y="160" class="node-desc">• Faceted category &amp; price aggregations</text>
      <text x="20" y="180" class="node-desc">• Kibana 8.13.0 Web UI on port 5601</text>
      <text x="20" y="202" class="node-tag" style="fill:#0d9488;">Sub-10ms P99 query latency</text>
    </g>
  </g>
</svg>
